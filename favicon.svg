<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Tuned for 16px. The previous version used a 4.6-wide stroke on a 16x16
       inner square, which left three near-equal concentric bands and collapsed
       into a mushy bullseye in the tab. Thinner stroke + larger counter so it
       still reads as a square inside a square at favicon size. -->
  <rect width="32" height="32" rx="7" fill="#7E8A5A"/>
  <rect x="7.5" y="7.5" width="17" height="17" rx="4.4" fill="none" stroke="#F7F3EA" stroke-width="3"/>
</svg>
