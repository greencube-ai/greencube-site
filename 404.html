  <style>
    :root { --paper: #F5F1E8; --ink: #1A1A1A; --ink-soft: #545454; --line: #DDD8CE; --olive: #7E8A5A; --olive-deep: #5C663F;
      --display: 'General Sans', 'Geist', -apple-system, system-ui, sans-serif; --sans: 'Geist', -apple-system, 'Segoe UI', Roboto, sans-serif; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { min-height: 100vh; display: flex; flex-direction: column; background: var(--paper); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
    header { padding: 22px 30px; }
    .brand { display: inline-flex; align-items: center; gap: 10px; font-family: var(--display); font-weight: 600; font-size: 19px; color: var(--ink); text-decoration: none; }
    .brand .mark { width: 15px; height: 15px; border: 2.6px solid var(--olive); border-radius: 4px; }
    main { flex: 1; display: grid; place-items: center; padding: 20px 24px 80px; text-align: center; }
    .turtle { width: 150px; margin: 0 auto 18px; overflow: visible; animation: swim 2.6s ease-in-out infinite; }
    .turtle .tt-arm { transform-box: view-box; transform-origin: 88px 58px; animation: wave 1.6s ease-in-out infinite; }
    .turtle .tt-eyes { transform-box: fill-box; transform-origin: center; animation: blink 4.6s infinite; }
    @keyframes swim { 0%, 100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-8px) rotate(2deg); } }
    @keyframes wave { 0%, 100% { transform: rotate(0); } 30% { transform: rotate(-28deg); } 60% { transform: rotate(4deg); } }
    @keyframes blink { 0%, 93%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.1); } }
    h1 { font-family: var(--display); font-weight: 600; font-size: clamp(34px, 6vw, 56px); letter-spacing: -.035em; line-height: 1.05; }
    h1 em { font-style: normal; color: var(--olive); }
    p { font-size: 18px; color: var(--ink-soft); margin-top: 12px; }
    p.es { font-size: 15px; margin-top: 6px; }
    .btns { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 28px; }
    .btns a { display: inline-flex; align-items: center; gap: 8px; padding: 13px 22px; border-radius: 12px; font-weight: 600; font-size: 15px; text-decoration: none; }
    .btns .go { background: var(--ink); color: var(--paper); }
    .btns .alt { border: 1px solid var(--line); color: var(--ink); background: #FBF8F0; }
    @media (prefers-reduced-motion: reduce) { .turtle, .turtle * { animation: none !important; } }
  </style>
